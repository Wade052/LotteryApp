<!DOCTYPE html>
<html>
    <head>
        <title>Title</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- UIkit CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/css/uikit.min.css" />
        <!-- UIkit JS -->
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit-icons.min.js"></script>
      <script type="module" crossorigin src="/LotteryApp/assets/index-DxhB462O.js"></script>
      <link rel="stylesheet" crossorigin href="/LotteryApp/assets/index-BIEtBj5e.css">
    </head>
    <body>

        <div class="uk-badge">99999</div>
        <div class="uk-badge">10000</div>

        <form>
            <fieldset class="uk-fieldset">
                <h1 class="uk-heading-line"><span>Lottery Application</span></h1>

                <div class="TicketContainer uk-child-width-1-3@m uk-grid-small uk-grid-match" uk-grid>
                    <div class="ticket" id="BasicTicketContainer">
                        <h2>Basic Ticket</h2>
                        <p>Price: $1</p>
                        <p>Numbers: 1-20</p>
                        <p>Pick 3 numbers</p>
                    </div>
                    <div class="ticket" id="StandardTicketContainer">
                        <h2>Standard Ticket</h2>
                        <p>Price: $3</p>
                        <p>Numbers: 1-50</p>
                        <p>Pick 5 numbers</p>
                    </div>
                    <div class="ticket" id="MegaTicketContainer">
                        <h2>Mega Ticket</h2>
                        <p>Price: $5</p>
                        <p>Numbers: 1-60</p>
                        <p>Pick 6 numbers</p>
                    </div>
                </div>

                <div class="uk-margin">
                    <button id="BasicTicket" type="button" class="uk-button uk-button-primary">Basic Ticket</button>
                    <button id="StandardTicket" type="button" class="uk-button uk-button-primary">Standard Ticket</button>
                    <button id="MegaTicket" type="button" class="uk-button uk-button-primary">Mega Ticket</button>
                </div>

                <label>Enter your numbers:</label>
                <input type="text" id="Num1" name="Num1" placeholder="Pick 1" class="uk-input uk-form-width-small">
                <input type="text" id="Num2" name="Num2" placeholder="Pick 2" class="uk-input uk-form-width-small">
                <input type="text" id="Num3" name="Num3" placeholder="Pick 3" class="uk-input uk-form-width-small">
                <input type="text" id="Num4" name="Num4" placeholder="Pick 4" class="uk-input uk-form-width-small">
                <input type="text" id="Num5" name="Num5" placeholder="Pick 5" class="uk-input uk-form-width-small">
                <input type="text" id="Num6" name="Num6" placeholder="Pick 6" class="uk-input uk-form-width-small">

                <div class="uk-margin">
                    <button id="ReadyButton" class="uk-button uk-button-primary">Play</button>
                </div>

            </fieldset>
        </form>

    </body>
</html>
